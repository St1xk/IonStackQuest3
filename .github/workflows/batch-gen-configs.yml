    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install vmlinux-to-elf pyelftools
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full xxd 2>/dev/null || true

      - name: Get magiskboot
        run: |
          wget -nv -O magisk.apk "https://github.com/topjohnwu/Magisk/releases/latest/download/app-debug.apk"
          unzip -o -j magisk.apk 'lib/x86_64/libmagiskboot.so' -d .
          chmod +x libmagiskboot.so
          rm -f magisk.apk

      - name: Generate config for ${{ matrix.fw }}
        run: |
          set -e
          FW="${{ matrix.fw }}"
          ROM_URL="https://files.cocaine.trade/firmware/meta/Quest%203/q3_${FW}.zip"
          echo "[*] Firmware: $FW"
          echo "[*] URL: $ROM_URL"

          wget -nv -O rom.zip "$ROM_URL"
          mkdir -p rom_out
          unzip -o -q rom.zip -d rom_out
          rm -f rom.zip

          PAYLOAD=$(find rom_out -name 'payload.bin' -type f | head -1)
          if [ -n "$PAYLOAD" ]; then
            ./libmagiskboot.so extract "$PAYLOAD" boot boot.img
          else
            BOOT=$(find rom_out -name 'boot.img' -type f | head -1)
            if [ -n "$BOOT" ]; then
              cp "$BOOT" boot.img
            fi
          fi
          rm -rf rom_out

          if [ ! -f boot.img ]; then
            echo "[!] No boot.img for $FW"
            exit 1
          fi

          mkdir -p boot_unpack && cd boot_unpack
          ../libmagiskboot.so unpack ../boot.img
          [ -f kernel ] && cp kernel ../kernel.Image
          cd ..
          rm -rf boot_unpack boot.img

          if [ ! -f kernel.Image ]; then
            echo "[!] No kernel for $FW"
            exit 1
          fi

          vmlinux-to-elf --base-address 0xFFFFFFC008000000 kernel.Image kernel.elf
          rm -f kernel.Image

          python3 gen_ionstack_config.py kernel.elf "eureka_${FW}.conf"
          rm -f kernel.elf

          echo "===== eureka_${FW}.conf ====="
          cat "eureka_${FW}.conf"

      - uses: actions/upload-artifact@v4
        with:
          name: config-${{ matrix.fw }}
          path: eureka_${{ matrix.fw }}.conf
          retention-days: 30
